[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureScript "OnLoaded()"]
ContextTitle=Wallets and settings...
ContextAction=[!CommandMeasure MeasureScript "OpenWallets(1)"]
ContextTitle2=Add a wallet...
ContextAction2=[!CommandMeasure MeasureScript "OpenWallets(2)"]
ContextTitle3=Show the next wallet
ContextAction3=[!CommandMeasure MeasureScript "NextWallet()"]
ContextTitle4=Remove the wallet shown
ContextAction4=[!CommandMeasure MeasureScript "RemoveShownWallet()"]
ContextTitle5=Edit the settings file (alerts, refresh)
ContextAction5=["notepad.exe" "#@#Settings.inc"]
ContextTitle6=Open flyingtulip.com
ContextAction6=[!CommandMeasure MeasureScript "OpenLink('menu-open-site','https://flyingtulip.com/')"]
ContextTitle7=Advanced: anonymous usage stats on or off
ContextAction7=[!CommandMeasure MeasureScript "ToggleAnalytics()"]
; the mouse coming over the skin counts as opening it (at most once per 30 minutes) in the anonymous usage stats
MouseOverAction=[!CommandMeasure MeasureScript "PanelOpen()"]

[Metadata]
Name=Flying Tulip
Author=Flying Tulip
Information=FT market price, 24h application fees and, for the wallets you set, health factor with liquidation alerts, PnL, FT earned, points, ftPUT gain and positions. Public API only (api.flyingtulip.com), no keys. Not financial advice.
Version=1.3.0
License=MIT. The Flying Tulip name and logo are trademarks of Flying Tulip and are not covered by the MIT license.

[Variables]
@Include=#@#Settings.inc
RankPage=7
; set by the script: the wallet shown, and the one the background health check reads
CurWallet=
WatchWallet=

@Include2=#@#Data.inc

; ---------------------------------------------------------------- styles
[StyLabel]
FontFace=Segoe UI
FontSize=10
FontColor=113,113,122,255
AntiAlias=1
StringAlign=Left
X=14

[StyVal]
FontFace=Consolas
FontSize=11
FontColor=228,228,231,255
AntiAlias=1
StringAlign=Right
ClipString=1
W=210
X=326

[StyDetail]
FontFace=Consolas
FontSize=9
FontColor=161,161,170,255
AntiAlias=1
StringAlign=Left
ClipString=1
X=24
W=302

[StyChartLabel]
FontFace=Segoe UI
FontSize=8
FontColor=113,113,122,255
AntiAlias=1
X=14
W=312
ClipString=1

[StyTab]
FontFace=Segoe UI
FontSize=10
StringStyle=Bold
FontColor=113,113,122,255
AntiAlias=1
StringAlign=Left
Padding=0,2,0,4

[StyIcon]
FontFace=Segoe UI Symbol
FontSize=13
FontColor=183,177,255,255
AntiAlias=1
StringAlign=Right

[StyButton]
FontFace=Segoe UI
FontSize=10
FontColor=183,177,255,255
SolidColor=36,32,66,255
Padding=10,5,10,5
AntiAlias=1
StringAlign=Left

[StyPos]
FontFace=Consolas
FontSize=9
FontColor=228,228,231,255
AntiAlias=1
X=14
W=312
ClipString=1

; ---------------------------------------------------------------- logic
[MeasureScript]
Measure=Script
ScriptFile=#@#Lua\FlyingTulip.lua

; The settings box (the InputText plugin ships with Rainmeter). It appears over the top of the tab content.
; Batch 1 edits the whole wallet list, batch 2 adds one wallet (its box starts empty).
[MeasureInput]
Measure=Plugin
Plugin=InputText
X=14
Y=100
W=312
H=26
SolidColor=58,50,110,255
FontColor=228,228,231,255
FontFace=Consolas
FontSize=10
StringAlign=Left
FocusDismiss=1
DefaultValue=#Wallets#
DynamicVariables=1
Command1=[!CommandMeasure MeasureScript "SetWallets('$UserInput$')"]
Command2=[!CommandMeasure MeasureScript "AddWallet('$UserInput$')"] DefaultValue=""
OnDismissAction=[!CommandMeasure MeasureScript "Render()"]

