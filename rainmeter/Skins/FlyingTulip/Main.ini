[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureScript "OnLoaded()"]
ContextTitle=Set wallet...
ContextAction=[!CommandMeasure MeasureInput "ExecuteBatch 1"]
ContextTitle2=Edit settings
ContextAction2=["notepad.exe" "#@#Settings.inc"]
ContextTitle3=Open dashboard
ContextAction3=["https://flyingtulip.com/statistics/"]

[Metadata]
Name=Flying Tulip
Author=Flying Tulip
Information=FT market price, 24h application fees and, for a wallet you set, health factor with liquidation alerts, PnL, FT earned, points, ftPUT gain and positions. Public API only (api.flyingtulip.com), no keys. Not financial advice.
Version=1.0.0
License=MIT. The Flying Tulip name and logo are trademarks of Flying Tulip and are not covered by the MIT license.

[Variables]
@Include=#@#Settings.inc
RankPage=7

@Include2=#@#Data.inc

; ---------------------------------------------------------------- styles
[StyLabel]
FontFace=Segoe UI
FontSize=10
FontColor=113,113,122,255
AntiAlias=1
StringAlign=Left
X=14

[StyVal]
FontFace=Consolas
FontSize=11
FontColor=228,228,231,255
AntiAlias=1
StringAlign=Right
ClipString=1
W=210
X=326

[StySection]
FontFace=Segoe UI
FontSize=8
StringStyle=Bold
FontColor=117,89,255,255
AntiAlias=1
X=14

[StyChartLabel]
FontFace=Segoe UI
FontSize=8
FontColor=113,113,122,255
AntiAlias=1
X=14
W=312
ClipString=1

[StyButton]
FontFace=Segoe UI
FontSize=10
FontColor=183,177,255,255
SolidColor=36,32,66,255
Padding=10,5,10,5
AntiAlias=1
StringAlign=Left

[StyPos]
FontFace=Consolas
FontSize=9
FontColor=228,228,231,255
AntiAlias=1
X=14
W=312
ClipString=1

; ---------------------------------------------------------------- logic
[MeasureScript]
Measure=Script
ScriptFile=#@#Lua\FlyingTulip.lua

; Optional input box (the InputText plugin ships with Rainmeter). It appears over the account area.
[MeasureInput]
Measure=Plugin
Plugin=InputText
X=14
Y=300
W=312
H=26
SolidColor=30,28,48,255
FontColor=228,228,231,255
FontFace=Consolas
FontSize=11
StringAlign=Left
FocusDismiss=1
DefaultValue=#Wallet#
DynamicVariables=1
Command1=[!CommandMeasure MeasureScript "SetWallet('$UserInput$')"]

; ---------------------------------------------------------------- panel
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,340,550,12 | Fill Color 14,14,17,240 | StrokeWidth 1 | Stroke Color 76,76,82,128

[MeterLogo]
Meter=Image
ImageName=#@#logo.png
X=14
Y=12
W=30
H=30
LeftMouseUpAction=["https://flyingtulip.com/statistics/"]

[MeterTitle]
Meter=String
MeterStyle=StyLabel
X=54
Y=12
FontSize=14
StringStyle=Bold
FontColor=228,228,231,255
Text=Flying Tulip

[MeterSub]
Meter=String
MeterStyle=StyLabel
X=54
Y=32
FontSize=9
Text=Market, fees and your account

[MeterStatus]
