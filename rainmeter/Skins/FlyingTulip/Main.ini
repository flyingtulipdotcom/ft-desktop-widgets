; Generated by tools/gen_main_ini.js: edit that script, not this file.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureScript "OnLoaded()"]
ContextTitle=Wallets and settings...
ContextAction=[!CommandMeasure MeasureScript "OpenWallets(1)"]
ContextTitle2=Add a wallet...
ContextAction2=[!CommandMeasure MeasureScript "OpenWallets(2)"]
ContextTitle3=Show the next wallet
ContextAction3=[!CommandMeasure MeasureScript "NextWallet()"]
ContextTitle4=Remove the wallet shown
ContextAction4=[!CommandMeasure MeasureScript "RemoveShownWallet()"]
ContextTitle5=Edit the settings file (alerts, refresh)
ContextAction5=["notepad.exe" "#@#Settings.inc"]
ContextTitle6=Open flyingtulip.com
ContextAction6=[!CommandMeasure MeasureScript "OpenLink('menu-open-site','https://flyingtulip.com/')"]
ContextTitle7=Advanced: anonymous usage stats on or off
ContextAction7=[!CommandMeasure MeasureScript "ToggleAnalytics()"]
; the mouse coming over the skin counts as opening it (at most once per 30 minutes) in the anonymous usage stats
MouseOverAction=[!CommandMeasure MeasureScript "PanelOpen()"]

[Metadata]
Name=Flying Tulip
Author=Flying Tulip
Information=FT market price, 24h application fees and, for the wallets you set, health factor with liquidation alerts, PnL, FT earned, points, ftPUT gain and positions. Public API only (api.flyingtulip.com), no keys. Not financial advice.
Version=1.4.0
License=MIT. The Flying Tulip name and logo are trademarks of Flying Tulip and are not covered by the MIT license.

[Variables]
@Include=#@#Settings.inc
RankPage=7
; set by the script: the wallet shown, the one the background health check reads, the FT earned history range
CurWallet=
WatchWallet=
HistRange=30d

@Include2=#@#Data.inc

