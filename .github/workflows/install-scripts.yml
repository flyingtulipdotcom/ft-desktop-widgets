name: Install scripts

# Runs the one-liners people paste (rainmeter/install.ps1 and xbar/install.sh) end to end against the real published
# releases: native path, fallback path, force switches and the checksum fail-closed path.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rainmeter/install.ps1"
      - "xbar/install.sh"
      - ".github/workflows/install-scripts.yml"
  push:
    branches: [main]
    paths:
      - "rainmeter/install.ps1"
      - "xbar/install.sh"
      - ".github/workflows/install-scripts.yml"

env:
  FT_GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows install.ps1 (Windows PowerShell 5.1, piped to iex)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Auto mode on this runner (Windows Server has no Widgets Board) falls back to Rainmeter and says why
        shell: powershell
        run: |
          $env:FT_WIDGET = ""
          $out = & { Get-Content -Raw rainmeter/install.ps1 | Invoke-Expression } *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Using the Rainmeter skin instead of the Widgets Board widget: this is Windows Server") { throw "expected the Server fallback message" }
          if (Get-AppxPackage -Name FlyingTulip.WindowsWidget) { throw "the widget must not be installed in auto mode here" }

      - name: Rainmeter fallback end to end (force switch rainmeter)
        shell: powershell
        run: |
          choco install rainmeter -y --no-progress 2>&1 | Select-Object -Last 3
          $rm = @("$env:ProgramFiles\Rainmeter\Rainmeter.exe", "${env:ProgramFiles(x86)}\Rainmeter\Rainmeter.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $env:FT_WIDGET = "rainmeter"
          $out = & { Get-Content -Raw rainmeter/install.ps1 | Invoke-Expression } *>&1 | Out-String
          Write-Host $out
          if ($rm) {
            if ($out -notmatch "Opened the Rainmeter skin installer") { throw "expected the skin installer to open" }
            if (-not (Get-ChildItem $env:TEMP -Filter *.rmskin)) { throw "no .rmskin downloaded" }
          } else {
            if ($out -notmatch "Rainmeter not found") { throw "expected the Rainmeter not found message" }
          }

      - name: Checksum mismatch fails closed (tampered SHA256SUMS served locally)
        shell: powershell
        run: |
          New-Item -ItemType Directory mock | Out-Null
          ("0" * 64 + "  FlyingTulipWidget.msix") | Set-Content mock/SHA256SUMS
          Invoke-WebRequest "https://api.github.com/repos/flyingtulipdotcom/ft-desktop-widgets/releases?per_page=100" -OutFile real.json -UseBasicParsing -Headers @{ "User-Agent" = "ci"; "Authorization" = "Bearer ${{ github.token }}" }
          @'
          map(if (.tag_name|startswith("windows-widget-v")) then .assets |= map(if .name=="SHA256SUMS" then .browser_download_url="http://127.0.0.1:8765/SHA256SUMS" else . end) else . end)
          '@ | Set-Content -Encoding ascii filter.jq
          jq -f filter.jq real.json | Set-Content -Encoding ascii mock/releases.json
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","mock" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          try {
            $env:FT_WIDGET = "native"
            $env:FT_RELEASES_URL = "http://127.0.0.1:8765/releases.json"
            $failed = $false
            try { Get-Content -Raw rainmeter/install.ps1 | Invoke-Expression } catch { $failed = $true; Write-Host "failed as expected: $($_.Exception.Message)"; if ($_.Exception.Message -notmatch "Checksum mismatch") { throw "wrong failure" } }
            if (-not $failed) { throw "a tampered checksum must stop the install" }
            if (Get-AppxPackage -Name FlyingTulip.WindowsWidget) { throw "nothing may be installed after a mismatch" }
          } finally { Stop-Process -Id $srv.Id -Force }

      - name: Native install steps with detection forced on (FT_WIDGET=native), then re-run to upgrade in place
        shell: powershell
        run: |
          $env:FT_WIDGET = "native"
          $env:FT_RELEASES_URL = ""
          Get-Content -Raw rainmeter/install.ps1 | Invoke-Expression
          $p = Get-AppxPackage -Name FlyingTulip.WindowsWidget
          if (-not $p) { throw "MSIX package not installed" }
          Write-Host "package: $($p.PackageFullName)"
          $cer = Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object { $_.Subject -match "Flying" }
          if (-not $cer) { throw "certificate not trusted" }
          if (-not (Get-AppxPackage -Name Microsoft.WindowsAppRuntime.1.8)) { throw "Windows App Runtime missing" }
          $out = & { Get-Content -Raw rainmeter/install.ps1 | Invoke-Expression } *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Already installed and up to date") { throw "second run should be a no-op upgrade check" }

  macos:
    name: macOS install.sh (${{ matrix.os }}, piped to bash)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Any native failure falls back to the xbar plugin and says why
        run: |
          mkdir -p "$HOME/Library/Application Support/xbar/plugins"
          out="$(FT_RELEASES_URL=http://127.0.0.1:9/none bash < xbar/install.sh 2>&1)"; echo "$out"
          echo "$out" | grep -q "Could not install the native app" || { echo "expected the fallback message"; exit 1; }
          [ -f "$HOME/Library/Application Support/xbar/plugins/flyingtulip.1m.sh" ] || { echo "plugin not installed"; exit 1; }
          [ ! -d "/Applications/Flying Tulip.app" ] || { echo "app must not be installed"; exit 1; }

      - name: Checksum mismatch fails closed (tampered SHA256SUMS served locally)
        run: |
          mkdir mock
          echo "$(printf '0%.0s' $(seq 64))  FlyingTulip-2.0.0.zip" > mock/SHA256SUMS
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/flyingtulipdotcom/ft-desktop-widgets/releases?per_page=100" -o real.json
          jq 'map(if (.tag_name|startswith("macos-v")) then .assets |= map(if .name=="SHA256SUMS" then .browser_download_url="http://127.0.0.1:8765/SHA256SUMS" else . end) else . end)' real.json > mock/releases.json
          python3 -m http.server 8765 --bind 127.0.0.1 --directory mock >/dev/null 2>&1 &
          srv=$!
          sleep 2
          set +e
          out="$(FT_RELEASES_URL=http://127.0.0.1:8765/releases.json bash < xbar/install.sh 2>&1)"; rc=$?
          set -e
          kill "$srv"
          echo "$out"; echo "exit code $rc"
          [ "$rc" -ne 0 ] || { echo "a tampered checksum must fail"; exit 1; }
          echo "$out" | grep -q "Checksum mismatch" || { echo "expected the mismatch message"; exit 1; }
          echo "$out" | grep -q "Using the xbar" && { echo "must not fall back on a mismatch"; exit 1; }
          [ ! -d "/Applications/Flying Tulip.app" ] || { echo "nothing may be installed after a mismatch"; exit 1; }

      - name: Native install via the real one-liner shape (curl | bash), old plugin present is kept and the command printed
        run: |
          out="$(cat xbar/install.sh | bash 2>&1)"; echo "$out"
          app="/Applications/Flying Tulip.app"
          [ -d "$app" ] || { echo "app not in /Applications"; exit 1; }
          echo "$out" | grep -q "Checksum verified" || { echo "no checksum step"; exit 1; }
          echo "$out" | grep -q "To remove it:  rm " || { echo "expected the plugin removal hint"; exit 1; }
          [ -f "$HOME/Library/Application Support/xbar/plugins/flyingtulip.1m.sh" ] || { echo "plugin must be left in place by default"; exit 1; }
          sleep 3
          pgrep -f "Flying Tulip.app/Contents/MacOS/" >/dev/null || { echo "app is not running"; exit 1; }
          echo "version: $(defaults read "$app/Contents/Info" CFBundleShortVersionString)"
          xattr -p com.apple.quarantine "$app" 2>/dev/null && { echo "quarantine flag present"; exit 1; }
          true

      - name: Re-run upgrades in place and FT_REMOVE_XBAR=1 removes the old plugin
        run: |
          FT_REMOVE_XBAR=1 bash < xbar/install.sh
          [ ! -f "$HOME/Library/Application Support/xbar/plugins/flyingtulip.1m.sh" ] || { echo "plugin should be removed"; exit 1; }
          [ -d "/Applications/Flying Tulip.app" ] || { echo "app missing after re-run"; exit 1; }
          sleep 3
          pgrep -f "Flying Tulip.app/Contents/MacOS/" >/dev/null || { echo "app is not running after re-run"; exit 1; }

      - name: Force switch xbar installs the plugin
        run: |
          FT_WIDGET=xbar bash < xbar/install.sh
          [ -f "$HOME/Library/Application Support/xbar/plugins/flyingtulip.1m.sh" ] || { echo "plugin not installed"; exit 1; }

      - name: Quit the app
        if: always()
        run: osascript -e 'tell application id "com.flyingtulip.widget" to quit' || true
